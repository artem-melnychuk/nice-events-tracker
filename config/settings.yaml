storage:
  raw_path: data/raw/nice_events_raw.xlsx
  processed_path: data/processed/nice_events_processed.xlsx

collection:
  # Which events to collect from the sources that list more than concerts
  # (explorenicecotedazur, opera_de_nice, cannes, menton). Canonical names
  # from core/taxonomy.py: Concert, Festival, Show, Exhibition, Gastronomy,
  # Market, Sport, Other -- or `all`. Each source's own labels ("Exposition",
  # "Sports and recreation", "Récital") are mapped onto these. Asking for
  # Market, Sport, Gastronomy or Other makes Cannes and Menton open every
  # detail page instead of only the cultural ones, so those runs make more
  # requests. A one-off run can override this with --category.
  categories:
    - Concert
  # Themes with a poor like rate in the review tool (0/10 across Pop music,
  # Rap/R&B/Soul and Light music as of 100 ratings, 2026-09-17) -- sunk to the
  # bottom of the processed workbook instead of interleaved chronologically,
  # so review time goes to higher-potential events first. Not excluded
  # outright: still collected and still ratable, just deprioritized.
  deprioritized_themes:
    - Pop music
    - Rap, R&B, Soul
    - Light music

sources:
  - explorenicecotedazur
  - songkick
  - opera_de_nice
  - helloasso
  - panda_events
  - manual_events
  - cannes
  # antibes is switched off on purpose: its legal notice forbids "extractions de
  # base de donnees" without prior agreement, and its adapter has to pass as a
  # regular Chrome to get the detail pages. The code stays; re-enable only with
  # the site's written consent.
  # - antibes
  - menton

helloasso:
  # Hand-picked organizers, not a general filter -- add more slugs here as
  # you find other dark/alternative-music associations worth following.
  associations:
    - dark-paca
