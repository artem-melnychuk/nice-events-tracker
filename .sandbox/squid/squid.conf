# Allowlist proxy for the nice_events_tracker sandbox agent.
#
# No TLS interception: Squid reads only the hostname from the CONNECT
# request line, never decrypts traffic. Sites keep their own certificates
# and the agent's TLS verification is untouched.
#
# A domain here (leading dot) matches it and all its subdomains.
acl allowed_dst dstdomain .anthropic.com
acl allowed_dst dstdomain .claude.com

# Sources the tracker's plain-HTTP collectors talk to (config/settings.yaml
# "sources:" list). Playwright-based collectors (songkick, helloasso) never
# run live inside the sandbox -- its image has no browser installed on
# purpose -- so their domains don't need to be reachable from here either;
# they're still listed for when/if that changes.
acl allowed_dst dstdomain .explorenicecotedazur.com
acl allowed_dst dstdomain .opera-nice.org
acl allowed_dst dstdomain .panda-events.com
acl allowed_dst dstdomain .cannes-france.com
acl allowed_dst dstdomain .menton-riviera-merveilles.co.uk
acl allowed_dst dstdomain .songkick.com
acl allowed_dst dstdomain .helloasso.com

# Antibes is deliberately left out: the source is switched off in
# config/settings.yaml (its legal notice forbids scraping without consent).
# Add it here only if that changes.

acl SSL_ports port 443
acl CONNECT method CONNECT

http_access allow CONNECT SSL_ports allowed_dst
http_access deny CONNECT
http_access allow allowed_dst
http_access deny all

http_port 3128

# Small cache footprint; this proxy is a gate, not a speed-up.
cache_mem 8 MB
maximum_object_size 0 KB
access_log stdio:/var/log/squid/access.log
